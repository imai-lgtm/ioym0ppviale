<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: blob:; media-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>おいでよ、介護の1日。｜日本介護医療センター 採用体験ゲーム</title>
<meta name="description" content="日本介護医療センターの介護スタッフの1日を体験。資格がなくても大丈夫。見守りラウンドや先輩トークで、介護の仕事を知ろう。">
<link rel="preload" href="img/p_hero.webp" as="image">
<link rel="preload" href="fonts/ss-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ss-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="img/mark_cherry.webp" type="image/webp">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mimamori.css">
<link rel="stylesheet" href="css/nk.css">
</head>
<body>
<!-- 線アイコン（stroke 1.75） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-arrow-r" viewBox="0 0 24 24"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></symbol>
    <symbol id="i-arrow-l" viewBox="0 0 24 24"><path d="M19.5 12h-15M10.5 6l-6 6 6 6"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11.5M7 10.5l5 5 5-5M5 19.5h14"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M20.5 3.5L10 14M20.5 3.5l-6.5 17-4-6.5-6.5-4z"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8.5 8.5M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v4h4"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M6 5v14M19 5.5v13L9 12z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4.5v4h4M12 8v4.3l3 1.8"/></symbol>
    <symbol id="i-sticker" viewBox="0 0 24 24"><path d="M20 12.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6.5z"/><path d="M20 12.5h-5.5a2 2 0 0 0-2 2V20"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.5 3.5h3l1.5 4-2 1.3a10.5 10.5 0 0 0 6.2 6.2l1.3-2 4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.7a2 2 0 0 1 2-2.2z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 20V8.5l7-3.5v15M11 20v-9l9 2.5V20M3 20h18M14.5 16h2.5"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9-1.9 5.1-1.9-5.1-5.1-1.9 5.1-1.9z"/><path d="M18.5 16l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></symbol>
    <symbol id="i-swipe" viewBox="0 0 24 24"><path d="M8 12.5V6.8a1.6 1.6 0 0 1 3.2 0v4.7M11.2 10.5a1.6 1.6 0 0 1 3.2 0v1.2M14.4 11a1.6 1.6 0 0 1 3.1.4v3.1c0 3.3-2.4 5.5-5.4 5.5-2.4 0-3.7-1.1-5-3l-1.7-2.6a1.5 1.5 0 0 1 2.4-1.8L8 13.2"/><path d="M3.5 5h3M3.5 5l1.3-1.3M3.5 5l1.3 1.3M20.5 5h-3M20.5 5l-1.3-1.3M20.5 5l-1.3 1.3"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 20.5s-6.5-5.8-6.5-10.7a6.5 6.5 0 0 1 13 0c0 4.9-6.5 10.7-6.5 10.7z"/><circle cx="12" cy="9.8" r="2.3"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19.5v-15M6 10.5l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4.5v15M6 13.5l6 6 6-6"/></symbol>
    <symbol id="i-seal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.6l1.3 2.9 3.1.3-2.4 2.1.7 3.1-2.7-1.6-2.7 1.6.7-3.1-2.4-2.1 3.1-.3z"/></symbol>
    <symbol id="i-like" viewBox="0 0 24 24"><path d="M7.5 10.5v9H4.8a.8.8 0 0 1-.8-.8v-7.4a.8.8 0 0 1 .8-.8zM7.5 10.5l3.6-6.2a1.7 1.7 0 0 1 3.1 1.3L13.4 9h5a1.9 1.9 0 0 1 1.9 2.2l-1.1 6.6a2.1 2.1 0 0 1-2.1 1.7H7.5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.1"/></symbol>
  </defs>
</svg>

<div id="app" data-scr="title">

  <!-- 起動時のロゴ -->
  <div id="splash" aria-hidden="true"><img src="img/mark_cherry.webp" alt=""><i></i></div>

  <!-- タイトル -->
  <section class="scr on" id="title">
    <div class="t-hero">
      <div class="kv" id="tKv"></div>
      <div class="t-shade"></div>
      <p class="t-quote" id="tQuote"></p>
    </div>
    <div class="t-body">
      <img class="t-guide" id="tGuide" src="img/chelper_point.webp" alt="チェルパ～ちゃん">
      <img class="t-logo" src="img/logo_nk.webp" alt="株式会社日本介護医療センター">
      <span class="t-eye" id="tIssue"></span>
      <h1 id="tCatch"></h1>
      <p class="t-sub" id="tSub"></p>
      <div class="t-pills" id="tPills"></div>
      <button class="t-rec" id="tRec" hidden></button>
      <button class="btn accent t-start" id="btnStart"><span id="tStartLabel">はじめる</span><svg class="ic"><use href="#i-arrow-r"/></svg></button>
      <div class="t-meta">
        <span><svg class="ic"><use href="#i-clock"/></svg>約4分</span>
        <span><svg class="ic"><use href="#i-vol"/></svg>音が出ます</span>
        <span><svg class="ic"><use href="#i-user"/></svg>登録なし</span>
      </div>
    </div>
  </section>

  <!-- チャット（LINE風） -->
  <section class="scr" id="chat">
    <header class="c-bar">
      <div class="c-av" id="cIcons"></div>
      <div class="c-ttl"><b id="cName"></b><small id="cSub"></small></div>
    </header>
    <div class="c-stamp stamp" id="cTime"></div>
    <div class="c-log" id="cLog"></div>
    <div class="c-tray" id="cTray"></div>
  </section>

  <!-- 1日の写真クリップ（ストーリーズ風） -->
  <section class="scr dark" id="clip">
    <div class="cl-amb" id="clAmb"></div>
    <div class="cl-head">
      <div class="cl-bars" id="clBars"></div>
      <div class="cl-who"><span class="s"><img src="img/mark_cherry.webp" alt=""></span><b id="clWho"></b><small id="clTime"></small></div>
    </div>
    <div class="cl-stage" id="clStage"><div class="cl-pw"><div class="cl-ph" id="clPh"></div></div><span class="stamp" id="clStamp"></span></div>
    <div class="cl-cap" id="clCap"></div>
    <div class="cl-card" id="clCard"></div>
  </section>

  <!-- ホームさんぽ -->
  <section class="scr" id="walk">
    <div class="sc-head"><span class="eyebrow" id="wEye"></span><h2 id="wTitle"></h2><p id="wSub"></p></div>
    <div class="w-track" id="wTrack"></div>
    <div class="w-foot"><div class="dots" id="wDots"></div><button class="btn ink" id="wNext"><span>つぎへ</span><svg class="ic"><use href="#i-arrow-r"/></svg></button></div>
  </section>

  <!-- 見守りラウンド（mimamori.js が中身を作る） -->
  <section class="scr" id="work"></section>

  <!-- 正直トーク（スワイプ） -->
  <section class="scr" id="real">
    <div class="sc-head"><span class="eyebrow">正直トーク<em id="rCount"></em></span><h2 id="rTitle"></h2><p id="rSub"></p></div>
    <div class="r-stage" id="rStage">
      <div class="r-edge no" id="rEdgeNo"><svg class="ic"><use href="#i-arrow-l"/></svg><span>ちょっと不安</span></div>
      <div class="r-edge yes" id="rEdgeYes"><svg class="ic"><use href="#i-arrow-r"/></svg><span>いけそう</span></div>
      <div class="r-stack" id="rStack"></div>
    </div>
    <div class="r-say" id="rSay"></div>
    <div class="r-btns">
      <button class="r-btn no" id="rNo"><svg class="ic"><use href="#i-arrow-l"/></svg><span>ちょっと不安</span></button>
      <button class="r-btn yes" id="rYes"><span>いけそう</span><svg class="ic"><use href="#i-arrow-r"/></svg></button>
    </div>
  </section>

  <!-- 結果 -->
  <section class="scr" id="result">
    <div class="res">
      <header class="res-hero" id="resHero"></header>
      <div class="res-body">
        <div class="tiles" id="resTiles"></div>

        <section class="blk res-card">
          <h3 class="h3">あなたの1日カード</h3>
          <div class="polaroid"><img id="resImg" alt="あなたの1日のまとめ"><span class="pcap">介護の1日</span></div>
          <p class="hint">画像を長押し（PCは右クリック）しても保存できます</p>
          <div class="res-act">
            <button class="btn ink" id="bSave"><svg class="ic"><use href="#i-download"/></svg><span>画像を保存</span></button>
            <button class="btn line" id="bShare"><svg class="ic"><use href="#i-send"/></svg><span>友達や家族に送る</span></button>
          </div>
        </section>

        <nav class="blk list" aria-label="つぎの操作">
          <a class="lrow" id="bHp" target="_blank" rel="noopener"><span class="ib"><svg class="ic"><use href="#i-building"/></svg></span><span class="tx">採用サイトを見る</span><svg class="ic go"><use href="#i-ext"/></svg></a>
          <div id="resLinks"></div>
          <button class="lrow" id="bRetry"><span class="ib"><svg class="ic"><use href="#i-retry"/></svg></span><span class="tx">見守りラウンドにもう一度</span><svg class="ic go"><use href="#i-chev-r"/></svg></button>
          <button class="lrow" id="bRestart"><span class="ib"><svg class="ic"><use href="#i-restart"/></svg></span><span class="tx">最初から</span><svg class="ic go"><use href="#i-chev-r"/></svg></button>
        </nav>

        <section class="blk" id="resRec"></section>
        <section class="blk book"><div class="h3row"><h3 class="h3">魅力シール帳</h3><span class="cnt" id="bookCount"></span></div><p class="note" id="bookNote"></p><div class="grid" id="bookGrid"></div></section>
        <section class="blk info" id="resInfo"></section>
        <p class="credit" id="credit"></p>
      </div>
    </div>
  </section>

  <!-- 右上：シール数と音 -->
  <div class="hud" id="hud">
    <div class="pill" id="sealCount" aria-label="集めた魅力シール"><svg class="ic"><use href="#i-seal"/></svg><span>0/10</span></div>
    <button class="pill" id="mute" aria-label="音のオン・オフ"><svg class="ic"><use href="#i-vol"/></svg></button>
  </div>
  <!-- シール獲得（ダイナミックアイランド風） -->
  <div id="island" aria-live="polite"><div class="isl-in" id="islIn"></div></div>
</div>

<script src="js/company.js"></script>
<script src="js/audio.js"></script>
<script src="js/mimamori.js"></script>
<script src="js/app.js"></script>
</body>
</html>
